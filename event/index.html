<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
  <script>
    /* Clean URL (web only): /event/index.html → /event/. Skipped for file://
       previews so opening the file directly still works. */
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      if (!/\/index\.html$/.test(location.pathname)) return;
      location.replace(location.pathname.replace(/index\.html$/, '') + location.search + location.hash);
    })();
  </script>
  <title>Event — DikodeWorks</title>
  <meta name="description" content="DikodeWorks upcoming events and training schedule." />
  <link rel="icon" type="image/png" href="../dino/favicon.png" />
  <link rel="canonical" href="https://dikodeworks.id/event/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141414;
      --ink-soft: #333333;
      --muted: #777777;
      --line: #ececec;
      --line-strong: #d9d9d9;
      --white: #ffffff;
      --bg: #ffffff;
      --surface: #f7f7f7;
      --accent: #111111;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: clip;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky footer: main grows to fill the viewport so the copyright bar is
       always pinned to the bottom, on desktop and mobile. */
    main { flex: 1 0 auto; }
    footer { flex-shrink: 0; }

    ::selection { background: #e5e5e5; color: var(--ink); }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 32px);
    }

    /* Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand .brand-name {
      font-family: 'Google Sans', 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(1.25rem, 2.5vw, 1.55rem);
      letter-spacing: -0.01em;
      color: #4a4a4a;
    }

    .brand .brand-name .dot {
      color: #c02020;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .socials a:hover {
      color: #c02020;
      border-color: #c02020;
      transform: translateY(-1px);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      position: relative;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--muted);
      transition: color .2s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 1px;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--ink); }
    .nav-links a:hover::after,
    .nav-links a.active::after { transform: scaleX(1); }

    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      padding: 0;
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      margin: 0 auto;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .2s ease, opacity .2s ease;
    }

    .nav.open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav.open .nav-toggle span:nth-child(2) { opacity: 0; }
    .nav.open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-right, .brand { position: relative; z-index: 1; }

    /* Language switcher */
    .lang-switch {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-btn {
      padding: 5px 12px;
      border: none;
      background: transparent;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .lang-btn.active {
      background: var(--ink);
      color: var(--white);
    }

    .lang-btn:not(.active):hover {
      color: var(--ink);
    }

    /* Language switch transition */
    header, main, footer {
      transition: opacity .3s ease, transform .3s ease;
    }

    body.lang-fading header,
    body.lang-fading main,
    body.lang-fading footer {
      opacity: 0;
      transform: translateY(6px);
    }

    @media (prefers-reduced-motion: reduce) {
      header, main, footer { transition: none; transform: none; }
    }

    /* Schedule table */
    .event-section {
      padding: clamp(32px, 5vw, 56px) 0 clamp(64px, 8vw, 96px);
    }

    .jadwal-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
    }

    .jadwal-search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .jadwal-search-input {
      flex: 1;
      min-width: 0;
      padding: 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--white);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
    }

    .jadwal-search-input:focus {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-color: var(--ink);
    }

    .jadwal-search-clear {
      flex: none;
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--line);
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .jadwal-search-clear:hover {
      color: #c02020;
      background: var(--line-strong);
    }

    .jadwal-scroll {
      overflow: auto;
    }

    .jadwal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .jadwal-table thead th {
      position: sticky;
      top: 0;
      background: var(--line);
      z-index: 1;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: left;
      padding: 10px 14px;
      white-space: nowrap;
    }

    .jadwal-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
      vertical-align: top;
      background: var(--white);
    }

    .jadwal-table tbody td.jadwal-multi {
      white-space: pre;
      line-height: 1.5;
      padding-left: 18px;
    }

    .jadwal-table tbody tr:last-child td {
      border-bottom: none;
    }

    .jadwal-table tbody tr:not(.jadwal-status):hover td {
      background: var(--surface);
    }

    .jadwal-table .jadwal-status td {
      text-align: center;
      padding: 32px 0;
      color: var(--muted);
      font-style: italic;
    }

    .jadwal-register {
      display: inline-block;
      padding: 8px 20px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--white);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s ease, color .2s ease;
    }

    .jadwal-register:hover,
    .jadwal-register:focus-visible {
      background: #c02020;
    }

    .jadwal-meta {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Loading progress bar (1-100%) */
    .jadwal-progress {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .jadwal-progress.active {
      display: flex;
    }

    .jadwal-progress .jadwal-progress-track {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .jadwal-progress .jadwal-progress-fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #c02020;
      transition: width .15s linear;
    }

    .jadwal-progress .jadwal-progress-label {
      flex: none;
      min-width: 52px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    footer {
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .nav-toggle { display: flex; }

      .nav-right {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 8px 16px 20px;
        background: var(--white);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.08);
      }

      .nav.open .nav-right { display: flex; }

      .nav-links {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }

      .nav-links a {
        padding: 14px 0;
        font-size: 1.05rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }

      .nav-links a:last-child { border-bottom: none; }

      .nav-links a::after { display: none; }

      .socials { justify-content: center; padding-top: 16px; gap: 14px; }

      .lang-switch { align-self: center; margin-top: 16px; }
    }

    @media (max-width: 640px) {
      .jadwal-panel { padding: 16px; }
      .jadwal-table { min-width: 640px; }
      .footer-inner { flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>

</head>

    /* ---------- Language switcher ---------- */

        'nav.training': 'Training',
        'nav.schedule': 'Schedule',
        'nav.event': 'Event',
        'jadwal.loading': 'Loading…',
        'jadwal.loadingProgress': 'Loading…',

        'jadwal.error': 'Unable to load the events. Please try again later.',

        'jadwal.register': 'Register',

        'jadwal.searchEmpty': 'No matching events found.',
        'jadwal.notConfigured': 'Event source not configured yet.',

      },
      id: {

        'jadwal.error': 'Gagal memuat daftar kegiatan. Silakan coba lagi nanti.',
        'jadwal.updated': 'Di-update pada',
        'jadwal.register': 'Registrasi',
        'jadwal.searchPlaceholder': 'Cari kegiatan, tanggal, lokasi…',
        'jadwal.searchEmpty': 'Tidak ada kegiatan yang cocok.',
        'jadwal.notConfigured': 'Source kegiatan belum disetup.',
        'footer.rights': 'Hak cipta dilindungi.',
      },

    let fading = false;

    function switchLanguage(lang, animate = true) {
      const dict = i18n[lang] || i18n.en;

      const apply = () => {
        document.documentElement.lang = lang;

        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.dataset.i18n;
          if (dict[key] !== undefined) el.textContent = dict[key];
        });

        document.querySelectorAll('[data-i18n-html]').forEach((el) => {
          const key = el.dataset.i18nHtml;
          if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        const searchPh = document.getElementById('jadwal-search-input');
        if (searchPh && dict['jadwal.searchPlaceholder'] !== undefined) {
          searchPh.placeholder = dict['jadwal.searchPlaceholder'];
        }

        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        localStorage.setItem('dikodeworks-lang', lang);
      };

      if (!animate || lang === document.documentElement.lang || fading) {
        apply();
        return;
      }

      fading = true;
      document.body.classList.add('lang-fading');
      setTimeout(() => {
        apply();
        document.body.classList.remove('lang-fading');
        fading = false;
      }, 320);
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchLanguage(btn.dataset.lang));
    });

    switchLanguage(localStorage.getItem('dikodeworks-lang') || 'id', false);

    const localized = (key) => {
      const dict = i18n[document.documentElement.lang] || i18n.en;
      return dict[key] !== undefined ? dict[key] : key;
    };

    /* Only allow http(s), mailto or scheme-less (relative) URLs. Blocks
       javascript:, data:, vbscript: etc. coming from Notion cell content. */
    const safeUrl = (url) => {
      const s = String(url == null ? '' : url).trim();
      if (!s) return null;
      if (/^[a-z][a-z0-9+.-]*:/i.test(s)) {
        return /^(https?|mailto):/i.test(s) ? s : null;
      }
      return s;
    };

    /* Live Notion data via the public page API (CORS-enabled, no r.jina.ai
       proxy / no abuse rate-limits). Returns text blocks in document order. */
    async function notionApiLines(pageId) {
      /* Cache-buster required: the Notion API caches by URL and would otherwise
         serve stale content (e.g. an old Registrasi link). */
      const res = await fetch('https://notion-api.splitbee.io/v1/page/' + pageId + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('notion api ' + res.status);
      const data = await res.json();
      const root = (data[pageId] && data[pageId].value && data[pageId].value.value) || null;
      const out = [];
      const titleOf = (v) => {
        const p = v && v.properties && v.properties.title;
        if (!p) return '';
        try { return p.map((x) => x[0]).join(''); } catch (e) { return ''; }
      };
      const walk = (ids) => {
        (ids || []).forEach((id) => {
          const v = data[id] && data[id].value && data[id].value.value;
          if (!v) return;
          const t = titleOf(v);
          if (t) out.push(t);
          if (v.content && v.content.length) walk(v.content);
        });
      };
      if (root) walk(root.content);
      return out;
    }

    /* Mobile nav toggle */
    const navToggle = document.getElementById('nav-toggle');
    const nav = document.querySelector('.nav');
    navToggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    /* ---------- Event table (from the public Event Notion page, same pattern as
       the Training and Schedule menus: event.json snapshot → live render →
       embedded fallback) ---------- */
    const EVENT_NOTION_URL = 'https://teguhpm.notion.site/Event-3e16fa858bba80cc9ce1e72ebbabe516';
    const EVENT_PAGE_ID = '3e16fa858bba80cc9ce1e72ebbabe516';
    const EVENT_NOTION_LIVE_URL = 'https://r.jina.ai/' + EVENT_NOTION_URL;
    const EVENT_API_URL = '../event.json';
    const EVENT_REFRESH_MS = 5 * 60 * 1000;

    /* Preferred display columns. A source column is shown under the matching
       preferred group (by aliases) so wording in Notion never hides a field. */
    const EVENT_PREFERRED = [
      { name: 'Tanggal', keys: ['tanggal'] },
      { name: 'Event', keys: ['event', 'kegiatan', 'nama', 'judul'] },
      { name: 'Waktu', keys: ['waktu', 'jam', 'pukul'] },
      { name: 'Lokasi', keys: ['lokasi', 'tempat'] },
      { name: 'Biaya', keys: ['biaya', 'harga', 'donasi'] },
      { name: 'Registrasi', keys: ['registrasi', 'link'] },
    ];
    /* Extra column labels that should still be parsed and could be shown when
       present (beyond the preferred groups). */
    const EVENT_EXTRA_COLUMNS = ['DESKRIPSI', 'KUOTA', 'PESERTA', 'STATUS'];

    let activeColCount = EVENT_PREFERRED.length;

    /* Embedded snapshot so the table works even when event.json and the live
       Notion render are both unreachable (mirror of event.json). */
    const EVENT_INLINE_DATA = {
      "columns": ["Tanggal", "Event", "Waktu", "Lokasi", "Biaya", "Registrasi"],
      "rows": [
        [{"v": "DD-MM-YYYY", "link": null}, {"v": "Tech Talk - Product Manager di BUMN itu ngapain sih ?", "link": null}, {"v": "00:00", "link": null}, {"v": "Online", "link": null}, {"v": "FREE", "link": null}, {"v": "https://lynk.id/dikodeworks", "link": "https://lynk.id/dikodeworks"}]
      ]
    };

    const jadwalHead = document.getElementById('jadwal-head');
    const jadwalRows = document.getElementById('jadwal-rows');
    const jadwalMeta = document.getElementById('jadwal-meta');
    const jadwalSearchInput = document.getElementById('jadwal-search-input');
    const jadwalSearchClear = document.getElementById('jadwal-search-clear');

    const jadwalStatus = (message) => {
      const tr = document.createElement('tr');
      tr.className = 'jadwal-status';
      const td = document.createElement('td');
      td.setAttribute('colspan', String(activeColCount || EVENT_PREFERRED.length));
      td.textContent = message;
      tr.appendChild(td);
      jadwalRows.replaceChildren(tr);
    };

    /* ---------- Loading progress (1-100%) ---------- */
    const jadwalProgress = document.getElementById('jadwal-progress');
    const jadwalProgressFill = document.getElementById('jadwal-progress-fill');
    const jadwalProgressLabel = document.getElementById('jadwal-progress-label');

    let jadwalProgressTimer = null;
    let jadwalProgressTick = 0;
    let jadwalProgressValue = 0;

    const jadwalShowProgress = () => {
      if (!jadwalProgress) return;
      jadwalProgressValue = 0;
      jadwalProgressTick = 0;
      jadwalProgress.classList.add('active');
      jadwalProgressFill.style.width = '0%';
      jadwalProgressLabel.textContent = '0%';
      if (jadwalProgressTimer) clearInterval(jadwalProgressTimer);
      jadwalProgressTimer = setInterval(() => {
        jadwalProgressTick++;
        if (jadwalProgressValue < 90) {
          const step = Math.max(1, Math.ceil((90 - jadwalProgressValue) * 0.12 * (1 + Math.sin(jadwalProgressTick * 0.5))));
          jadwalProgressValue = Math.min(90, jadwalProgressValue + step);
        } else {
          jadwalProgressValue = Math.min(99, jadwalProgressValue + 1);
        }
        jadwalProgressFill.style.width = jadwalProgressValue + '%';
        jadwalProgressLabel.textContent = Math.round(jadwalProgressValue) + '%';
      }, 90);
    };

    const jadwalHideProgress = () => {
      if (jadwalProgressTimer) clearInterval(jadwalProgressTimer);
      jadwalProgressTimer = null;
      if (!jadwalProgress) return;
      jadwalProgressValue = 100;
      jadwalProgressFill.style.width = '100%';
      jadwalProgressLabel.textContent = '100%';
      setTimeout(() => {
        jadwalProgress.classList.remove('active');
      }, 250);
    };

    /* Notion/CI payload (schedule.json): { columns:[], rows:[[{v, link}]], updated? } */
    function normalizeSchedule(data) {
      const headers = (data.columns || []).map((h) => String(h).trim());
      const entries = (data.rows || []).map((row) => {
        return headers.map((h, ci) => {
          const cell = row[ci] || { v: '' };
          return { v: String(cell.v || ''), link: cell.link || null };
        });
      });
      return { headers, entries, updated: data.updated };
    }

    let jadwalRowsData = [];
    let jadwalMetaUpdated = null;

    /* Map discovered source headers (author's wording) onto the preferred
       display columns by alias; right-to-left each header is used at most
       once. Returns { indices } in display order. */
    function mapColumns(headers) {
      const lower = headers.map((h) => h.trim().toLowerCase());
      const used = new Set();
      const indices = [];
      const assign = (keys) => {
        const idx = lower.findIndex((h, i) => !used.has(i) && keys.includes(h));
        if (idx !== -1) {
          used.add(idx);
          indices.push(idx);
        }
      };
      EVENT_PREFERRED.forEach((g) => assign(g.keys));
      EVENT_EXTRA_COLUMNS.forEach((name) => assign([name.toLowerCase()]));
      /* Any remaining headers (e.g. Materi/Deskripsi wording we didn't list)
         get appended so data is never silently dropped. */
      lower.forEach((h, i) => { if (!used.has(i)) indices.push(i); });
      return indices;
    }

    function renderJadwal(headers, entries, updated) {
      const present = mapColumns(headers);
      activeColCount = Math.max(1, present.length);

      const headRow = document.createElement('tr');
      present.forEach((idx) => {
        const th = document.createElement('th');
        th.setAttribute('scope', 'col');
        th.textContent = headers[idx].trim();
        headRow.appendChild(th);
      });
      jadwalHead.replaceChildren(headRow);

      jadwalRowsData = entries
        .filter((cells) => cells.some((cell) => cell && cell.v !== ''))
        .map((cells) => present.map((idx) => cells[idx] || { v: '', link: null }));
      jadwalMetaUpdated = updated || new Date().toISOString();

      applyJadwalFilter();
    }

    function applyJadwalFilter() {
      const q = (jadwalSearchInput.value || '').trim().toLowerCase();

      if (!q) {
        jadwalSearchClear.style.display = 'none';
      } else {
        jadwalSearchClear.style.display = 'flex';
      }

      const visible = q
        ? jadwalRowsData.filter((cells) => cells.some((cell) => cell && cell.v.toLowerCase().includes(q)))
        : jadwalRowsData;

      jadwalRows.textContent = '';

      if (!visible.length) {
        if (q) {
          const tr = document.createElement('tr');
          tr.className = 'jadwal-status';
          const td = document.createElement('td');
          td.setAttribute('colspan', String(activeColCount || EVENT_PREFERRED.length));
          td.textContent = localized('jadwal.searchEmpty');
          tr.appendChild(td);
          jadwalRows.appendChild(tr);
        }
        jadwalMeta.textContent = jadwalMetaUpdated ? formatJadwalMeta(jadwalMetaUpdated) : '';
        return;
      }

      visible.forEach((cells) => {
        const tr = document.createElement('tr');
        cells.forEach((cell, i) => {
          const td = document.createElement('td');

          const href = cell.link ? safeUrl(cell.link) : null;
          if (href) {
            const a = document.createElement('a');
            a.className = 'jadwal-register';
            a.href = href;
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener');
            a.textContent = localized('jadwal.register');
            td.appendChild(a);
          } else if (cell.v.includes('\n')) {
            td.classList.add('jadwal-multi');
            td.textContent = cell.v;
          } else {
            td.textContent = cell.v;
          }
          tr.appendChild(td);
        });
        jadwalRows.appendChild(tr);
      });

      jadwalMeta.textContent = jadwalMetaUpdated ? formatJadwalMeta(jadwalMetaUpdated) : '';
    }

    const formatJadwalMeta = (updated) => {
      const date = new Date(updated);
      if (isNaN(date.getTime())) return '';
      const locale = document.documentElement.lang === 'id' ? 'id-ID' : 'en-US';
      const when = new Intl.DateTimeFormat(locale, {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      }).format(date);
      return localized('jadwal.updated') + ' ' + when;
    };

    /* Parse r.jina.ai Markdown of the Event Notion page. Like the Schedule parser:
       interleaved key/value lines after "Isi tabel", a repeated key starts a
       new row, and Notion row-number headings (### 001) are skipped. The set
       of columns is discovered from the page itself, so the layout can be
       Tanggal / Event / Waktu / Lokasi / Biaya / Registrasi — or any subset. */
    function parseEventMarkdown(text) {
      const KEYS = ['tanggal', 'event', 'kegiatan', 'nama', 'judul', 'pelatihan', 'training', 'modul', 'materi', 'waktu', 'jam', 'pukul', 'lokasi', 'tempat', 'biaya', 'harga', 'donasi', 'registrasi', 'link', 'kuota', 'peserta', 'status', 'deskripsi', 'detail'];
      const lines = String(text).split(/\r?\n/).map((l) => l.trim());
      const start = lines.findIndex((l) => l.trim().toLowerCase() === 'isi tabel');
      const rowData = [];
      const mdLink = new RegExp('\\[([^\\]]*)\\]\\(([^)]+)\\)');

      let row = new Map();
      let currentKey = null;

      const flush = () => {
        if (!row.size) return;
        rowData.push(row);
        row = new Map();
      };

      for (let i = (start === -1 ? 0 : start + 1); i < lines.length; i++) {
        const l = lines[i];
        if (!l) continue;
        if (/^#{1,6}\s*[0-9]{1,6}\s*$/.test(l) || /^[0-9]{3}$/.test(l)) continue;
        const low = l.toLowerCase();
        if (KEYS.includes(low)) {
          if (row.has(low)) flush();   /* repeat key → new row */
          currentKey = low;
        } else {
          const m = l.match(mdLink);
          const value = m ? m[1] : l;
          const link = m ? m[2] : (/^https?:\/\//i.test(l) ? l : null);
          if (!currentKey) continue;
          const existing = row.get(currentKey);
          if (existing) {
            existing.v += '\n' + value;
            if (link) existing.link = link;
          } else {
            row.set(currentKey, { v: value, link: link });
          }
        }
      }
      flush();

      /* Discover columns: the order they appear on the page, author wording. */
      const headers = [];
      const seen = new Set();
      for (let i = (start === -1 ? 0 : start + 1); i < lines.length; i++) {
        const low = lines[i].toLowerCase();
        if (KEYS.includes(low) && !seen.has(low) && rowData.some((r) => r.has(low))) {
          seen.add(low);
          headers.push(lines[i]); // original casing as authored
        }
      }

      const entries = rowData.map((r) => headers.map((h) => r.get(h.toLowerCase()) || { v: '', link: null }));
      return { headers, entries, updated: new Date().toISOString() };
    }

    async function fetchJadwal() {
      jadwalShowProgress();

      /* 1) LIVE Notion page API first (CORS-enabled, no r.jina proxy). */
      try {
        const lines = await notionApiLines(EVENT_PAGE_ID);
        const data = parseEventMarkdown(lines.join('\n'));
        if (data.entries.length) {
          renderJadwal(data.headers, data.entries, data.updated);
          jadwalHideProgress();
          return;
        }
      } catch (err) {
        /* fall through */
      }

      /* 2) r.jina.ai proxy fallback. */
      try {
        const res = await fetch(EVENT_NOTION_LIVE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = parseEventMarkdown(await res.text());
          if (data.entries.length) {
            renderJadwal(data.headers, data.entries, data.updated);
            jadwalHideProgress();
            return;
          }
        }
      } catch (err) {
        /* fall through */
      }

      /* 3) event.json snapshot (fallback when live is unreachable). */
      try {
        const cacheBust = EVENT_API_URL + '?t=' + Date.now();
        const res = await fetch(cacheBust, { cache: 'no-store' });
        if (res.ok) {
          const data = normalizeSchedule(await res.json());
          renderJadwal(data.headers, data.entries, data.updated);
          jadwalHideProgress();
          return;
        }
      } catch (err) {
        /* fall through */
      }

      /* 3) Embedded snapshot. */
      const fallback = normalizeSchedule(EVENT_INLINE_DATA);
      renderJadwal(fallback.headers, fallback.entries, null);
      jadwalHideProgress();
    }

    /* Filter the table as the user types; clear button resets it. */
    if (jadwalSearchInput) {
      jadwalSearchInput.addEventListener('input', applyJadwalFilter);
      jadwalSearchInput.addEventListener('search', applyJadwalFilter);
    }
    if (jadwalSearchClear) {
      jadwalSearchClear.addEventListener('click', () => {
        jadwalSearchInput.value = '';
        applyJadwalFilter();
        jadwalSearchInput.focus({ preventScroll: true });
      });
    }

    if (EVENT_API_URL) {
      fetchJadwal();
      setInterval(fetchJadwal, EVENT_REFRESH_MS);
    }

    /* Re-check the Event table whenever the tab is focused again, so it never
       keeps showing previously fetched rows. */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchJadwal();
    });
  </script>
  <script src="../assets/modals.js?v=3" defer></script>
</body>
