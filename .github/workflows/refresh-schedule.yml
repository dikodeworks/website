name: Refresh jadwal schedule from Notion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so two 5-minute refreshes never race on `git push`.
concurrency:
  group: refresh-notion-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run schedule builder
        env:
          NOTION_PAGE_ID: "3d76fa85-8bba-8067-8c5a-d21fda12a21f"
          NOTION_HOST: "teguhpm.notion.site"
          OUTPUT: "schedule.json"
        run: python3 scripts/build_schedule.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain schedule.json)" ]; then
            echo "schedule unchanged"
          else
            git add schedule.json
            git commit -m "Update schedule from Notion"
            git push
          fi
