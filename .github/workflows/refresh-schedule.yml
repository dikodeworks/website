name: Refresh jadwal schedule and event from Notion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run schedule builder
        env:
          NOTION_PAGE_ID: "3d76fa85-8bba-8067-8c5a-d21fda12a21f"
          NOTION_HOST: "teguhpm.notion.site"
          OUTPUT: "schedule.json"
        run: python3 scripts/build_schedule.py

      - name: Run event builder
        env:
          NOTION_PAGE_ID: "3e16fa85-8bba-80cc-9ce1-e72ebbabe516"
          NOTION_HOST: "teguhpm.notion.site"
          OUTPUT: "event.json"
        run: python3 scripts/build_event.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet schedule.json && git diff --quiet event.json; then
            echo "snapshots unchanged"
          else
            git add schedule.json event.json
            git commit -m "Update schedule and event from Notion"
            git push
          fi