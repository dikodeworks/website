<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — DikodeWorks</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://dikodeworks.id/event/" />
  <script>
    /* Keep the old /event.html URL working: on the web send it to the clean
       /event/; when opened straight from disk go to the file that exists. */
    (function () {
      var web = location.protocol === 'http:' || location.protocol === 'https:';
      location.replace((web ? 'event/' : 'event/index.html') + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=event/" /></noscript>
</head>
<body>
  <p>Mengalihkan ke <a href="event/">/event/</a>&hellip;</p>
</body>
</html>
